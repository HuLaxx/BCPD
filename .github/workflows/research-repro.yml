name: Dissertation reproduction protocol
on:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/research-repro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check independent Python research protocol
        run: python -m unittest discover -s research/tests -v
